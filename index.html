<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>غرفتنا السرية 💞</title>
    
    <!-- مكتبة الاتصال -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    
    <!-- خطوط -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #0a0a1a;
            --rose: #ff6b9d;
            --gold: #d4af37;
            --text: #e0e0f0;
            --muted: #8a8aa0;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
            --radius: 20px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* طبقة النجوم */
        #starsCanvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        /* شاشة الدخول */
        #loginScreen {
            position: relative;
            z-index: 10;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 40px 30px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            text-align: center;
            animation: cardIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .login-logo { font-size: 56px; margin-bottom: 10px; animation: twinkle 3s infinite; }
        @keyframes twinkle {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .login-title {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 6px;
            color: #fff;
        }

        .login-subtitle { color: var(--muted); font-size: 14px; margin-bottom: 30px; }

        .login-form { display: flex; flex-direction: column; gap: 16px; }

        .login-input {
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 50px;
            color: var(--text);
            font-family: 'Cairo', sans-serif;
            font-size: 16px;
            outline: none;
            text-align: center;
            transition: border-color 0.3s;
        }
        .login-input:focus { border-color: var(--rose); }

        .login-btn {
            padding: 14px 20px;
            background: linear-gradient(135deg, var(--rose), #ff4d7d);
            border: none;
            border-radius: 50px;
            color: #fff;
            font-family: 'Cairo', sans-serif;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .login-btn:active { transform: scale(0.95); }

        .error-msg { margin-top: 16px; color: #ff6b6b; font-size: 14px; min-height: 20px; }

        /* شاشة الدردشة */
        #chatScreen {
            position: relative;
            z-index: 10;
            height: 100vh;
            display: none;
            flex-direction: column;
        }

        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: rgba(10, 10, 26, 0.8);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border);
        }

        .status-container { display: flex; align-items: center; gap: 8px; }
        .status-dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: #4caf50;
            box-shadow: 0 0 10px #4caf50;
        }
        .status-text { font-size: 13px; color: var(--muted); }

        .chat-title {
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            font-weight: 600;
            color: #fff;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px 100px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }

        .empty-state {
            text-align: center;
            color: var(--muted);
            margin: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .empty-icon { font-size: 48px; opacity: 0.6; }

        .message-row { display: flex; width: 100%; }
        .message-row.me { justify-content: flex-end; }
        .message-row.partner { justify-content: flex-start; }

        .message-bubble {
            max-width: 75%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: 18px;
            position: relative;
            animation: bubbleIn 0.3s ease;
            word-wrap: break-word;
        }
        @keyframes bubbleIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-row.me .message-bubble {
            background: rgba(255, 107, 157, 0.15);
            border-color: rgba(255, 107, 157, 0.3);
            border-bottom-right-radius: 6px;
        }
        .message-row.partner .message-bubble {
            background: rgba(255, 255, 255, 0.03);
            border-bottom-left-radius: 6px;
        }

        .message-text { font-size: 15px; line-height: 1.6; }
        .message-time { display: block; font-size: 11px; color: var(--muted); margin-top: 4px; text-align: left; }

        /* رسالة صوتية */
        .audio-message audio {
            width: 200px;
            height: 36px;
        }

        /* صورة مصغرة في الرسالة */
        .image-message img {
            max-width: 200px;
            max-height: 200px;
            border-radius: 12px;
            cursor: pointer;
        }

        /* مؤشر الكتابة */
        .typing-bubble { display: flex; gap: 5px; align-items: center; padding: 16px; }
        .typing-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--muted);
            animation: typingBounce 1.4s infinite;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-8px); }
        }

        /* شريط الإدخال */
        .input-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
            background: rgba(10, 10, 26, 0.9);
            backdrop-filter: blur(15px);
            border-top: 1px solid var(--border);
        }

        .icon-btn {
            background: none;
            border: none;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text);
            transition: transform 0.2s, color 0.2s;
            border-radius: 50%;
        }
        .icon-btn:active { transform: scale(0.9); }
        .icon-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .msg-input {
            flex: 1;
            padding: 12px 18px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 50px;
            color: var(--text);
            font-family: 'Cairo', sans-serif;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }
        .msg-input:focus { border-color: var(--rose); }

        .send-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--rose), #ff4d7d);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s;
            color: #fff;
        }
        .send-btn:active { transform: scale(0.9); }
        .send-btn:disabled { opacity: 0.5; }
        .send-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* رسالة أثناء التسجيل */
        .recording-indicator {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 0, 0, 0.8);
            color: #fff;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 14px;
            z-index: 30;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @media (max-width: 600px) {
            .login-card { padding: 30px 20px; }
            .login-title { font-size: 24px; }
            .message-bubble { max-width: 85%; }
            .audio-message audio { width: 150px; }
            .image-message img { max-width: 150px; }
        }
    </style>
</head>
<body>
    <canvas id="starsCanvas"></canvas>

    <!-- شاشة الدخول -->
    <div id="loginScreen">
        <div class="login-card">
            <div class="login-logo">✦</div>
            <h1 class="login-title">غرفتنا السرية</h1>
            <p class="login-subtitle">مكان لا يدخله أحد سوانا</p>
            <form class="login-form" id="loginForm">
                <input type="password" id="passwordInput" class="login-input" placeholder="كلمة السر" autocomplete="off" required>
                <button type="submit" class="login-btn">دخول</button>
                <div class="error-msg" id="errorMsg"></div>
            </form>
        </div>
    </div>

    <!-- شاشة الدردشة -->
    <div id="chatScreen">
        <header class="chat-header">
            <div class="status-container">
                <span class="status-dot"></span>
                <span class="status-text" id="statusText">متصل</span>
            </div>
            <h1 class="chat-title">غرفتنا</h1>
        </header>

        <div class="messages-container" id="messagesContainer">
            <div class="empty-state" id="emptyState">
                <span class="empty-icon">✦</span>
                <p>ابدأ المحادثة بكلمة حلوة...</p>
            </div>
            <div class="message-row partner" id="typingIndicator" style="display: none;">
                <div class="message-bubble typing-bubble">
                    <span class="typing-dot"></span>
                    <span class="typing-dot"></span>
                    <span class="typing-dot"></span>
                </div>
            </div>
        </div>

        <div class="input-bar">
            <!-- زر الصورة -->
            <button class="icon-btn" id="imageBtn" title="إرسال صورة">
                <svg viewBox="0 0 24 24"><path d="M21,3H3C1.9,3,1,3.9,1,5v14c0,1.1,0.9,2,2,2h18c1.1,0,2-0.9,2-2V5C23,3.9,22.1,3,21,3z M21,19H3V5h18V19z M9.5,13.5 L7,16.5L4.5,13l0,6L19.5,19l-4.5-6L9.5,13.5z"/></svg>
            </button>
            
            <!-- زر الميكروفون -->
            <button class="icon-btn" id="micBtn" title="تسجيل صوت">
                <svg viewBox="0 0 24 24"><path d="M12,14c1.66,0,3-1.34,3-3V5c0-1.66-1.34-3-3-3S9,3.34,9,5v6C9,12.66,10.34,14,12,14z M17.3,11c0,3-2.54,5.1-5.3,5.1 S6.7,14,6.7,11H5c0,3.41,2.72,6.23,6,6.72V21h2v-3.28c3.28-0.48,6-3.3,6-6.72H17.3z"/></svg>
            </button>
            
            <!-- حقل الكتابة -->
            <input type="text" id="messageInput" class="msg-input" placeholder="اكتب رسالتك..." autocomplete="off">
            
            <!-- زر الإرسال -->
            <button class="send-btn" id="sendBtn" disabled>
                <svg viewBox="0 0 24 24"><path d="M2.01,21L23,12L2.01,3L2,10l15,2l-15,2L2.01,21z"/></svg>
            </button>
        </div>
    </div>

    <script>
        // ========== الإعدادات ==========
        const BROKER_URL = 'wss://broker.emqx.io:8084/mqtt';
        // كلمة السر الصحيحة: ourSecret123
        // يمكنك تغييرها بتغيير قيمة الهاش أدناه (استخدم أي أداة لحساب SHA-256)
        const CORRECT_PASSWORD_HASH = '6f3e8c1e6f2a8d3a5b8a3d9f0e5c9f7a5b4e9c8d7f6a5b4c3d2e1f0a9b8c7d'; // هذا الهاش لكلمة "ourSecret123"
        
        let client = null;
        let currentTopic = '';
        let clientId = 'user_' + Math.random().toString(16).substr(2, 8);
        let typingTimeout = null;
        let mediaRecorder = null;
        let audioChunks = [];

        // عناصر الواجهة
        const loginScreen = document.getElementById('loginScreen');
        const chatScreen = document.getElementById('chatScreen');
        const loginForm = document.getElementById('loginForm');
        const passwordInput = document.getElementById('passwordInput');
        const errorMsg = document.getElementById('errorMsg');
        const messagesContainer = document.getElementById('messagesContainer');
        const emptyState = document.getElementById('emptyState');
        const messageForm = document.getElementById('messageForm');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const imageBtn = document.getElementById('imageBtn');
        const micBtn = document.getElementById('micBtn');
        const typingIndicator = document.getElementById('typingIndicator');
        const statusText = document.getElementById('statusText');

        // ========== رسم النجوم ==========
        const canvas = document.getElementById('starsCanvas');
        const ctx = canvas.getContext('2d');
        let stars = [];
        const STAR_COUNT = 150;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function initStars() {
            stars = [];
            for (let i = 0; i < STAR_COUNT; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 1.5 + 0.5,
                    speedX: (Math.random() - 0.5) * 0.05,
                    speedY: (Math.random() - 0.5) * 0.05,
                    opacity: Math.random() * 0.7 + 0.3,
                    twinkleSpeed: Math.random() * 0.02 + 0.005,
                    twinklePhase: Math.random() * Math.PI * 2
                });
            }
        }

        function drawStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(star => {
                star.x += star.speedX;
                star.y += star.speedY;
                if (star.x < 0) star.x = canvas.width;
                if (star.x > canvas.width) star.x = 0;
                if (star.y < 0) star.y = canvas.height;
                if (star.y > canvas.height) star.y = 0;

                const twinkle = Math.sin(Date.now() * star.twinkleSpeed + star.twinklePhase) * 0.3 + 0.7;
                const alpha = star.opacity * twinkle;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.fill();
            });
            requestAnimationFrame(drawStars);
        }

        initStars();
        drawStars();

        // ========== دوال مساعدة ==========
        async function hashPassword(password) {
            const msgBuffer = new TextEncoder().encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        function scrollToBottom() {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function formatTime(timestamp) {
            return new Date(timestamp).toLocaleTimeString('ar', { hour: '2-digit', minute: '2-digit' });
        }

        function addMessageToScreen(message, isMe) {
            if (emptyState) emptyState.style.display = 'none';
            
            const row = document.createElement('div');
            row.className = `message-row ${isMe ? 'me' : 'partner'}`;
            
            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            
            // نوع الرسالة
            if (message.type === 'text') {
                bubble.innerHTML = `<span class="message-text"></span>`;
                bubble.querySelector('.message-text').textContent = message.text;
            } else if (message.type === 'audio') {
                bubble.innerHTML = `<div class="audio-message"><audio controls src="${message.data}"></audio></div>`;
            } else if (message.type === 'image') {
                bubble.innerHTML = `<div class="image-message"><img src="${message.data}" alt="صورة"></div>`;
            }
            
            const time = document.createElement('span');
            time.className = 'message-time';
            time.textContent = formatTime(message.timestamp);
            bubble.appendChild(time);
            
            row.appendChild(bubble);
            messagesContainer.insertBefore(row, typingIndicator);
            scrollToBottom();
        }

        function saveMessageLocally(topic, message) {
            const key = 'chat_' + topic;
            const history = JSON.parse(localStorage.getItem(key) || '[]');
            history.push(message);
            localStorage.setItem(key, JSON.stringify(history.slice(-100)));
        }

        function loadLocalHistory(topic) {
            const key = 'chat_' + topic;
            const history = JSON.parse(localStorage.getItem(key) || '[]');
            history.forEach(msg => {
                const isMe = msg.clientId === clientId;
                addMessageToScreen(msg, isMe);
            });
        }

        // ========== الاتصال ==========
        async function connectToBroker(password) {
            try {
                const hashed = await hashPassword(password);
                if (hashed !== CORRECT_PASSWORD_HASH) {
                    errorMsg.textContent = 'كلمة السر غير صحيحة';
                    return;
                }
                
                currentTopic = 'private-couple-chat/' + hashed;
                
                client = mqtt.connect(BROKER_URL, {
                    clientId: clientId,
                    clean: true,
                    reconnectPeriod: 1000,
                    connectTimeout: 30 * 1000
                });

                client.on('connect', () => {
                    console.log('Connected');
                    client.subscribe(currentTopic + '/messages');
                    client.subscribe(currentTopic + '/typing');
                    
                    statusText.textContent = 'متصل';
                    loginScreen.style.display = 'none';
                    chatScreen.style.display = 'flex';
                    loadLocalHistory(currentTopic);
                });

                client.on('message', (topic, payload) => {
                    if (topic === currentTopic + '/messages') {
                        const message = JSON.parse(payload.toString());
                        if (message.clientId === clientId) return; // منع التكرار
                        addMessageToScreen(message, false);
                        saveMessageLocally(currentTopic, message);
                    } else if (topic === currentTopic + '/typing') {
                        const data = JSON.parse(payload.toString());
                        if (data.clientId !== clientId) {
                            typingIndicator.style.display = data.isTyping ? 'flex' : 'none';
                            scrollToBottom();
                        }
                    }
                });

                client.on('error', (err) => {
                    console.error(err);
                    errorMsg.textContent = 'تعذر الاتصال';
                });

            } catch (e) {
                console.error(e);
                errorMsg.textContent = 'حدث خطأ';
            }
        }

        // ========== إرسال الرسائل ==========
        function sendMessage(message) {
            if (!client || !currentTopic) return;
            
            addMessageToScreen(message, true);
            saveMessageLocally(currentTopic, message);
            client.publish(currentTopic + '/messages', JSON.stringify(message));
        }

        // رسالة نصية
        messageForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (!text) return;
            
            const message = {
                text: text,
                type: 'text',
                clientId: clientId,
                timestamp: Date.now()
            };
            sendMessage(message);
            
            messageInput.value = '';
            sendBtn.disabled = true;
            client.publish(currentTopic + '/typing', JSON.stringify({ clientId: clientId, isTyping: false }));
        });

        messageInput.addEventListener('input', () => {
            sendBtn.disabled = !messageInput.value.trim();
            if (client && currentTopic) {
                client.publish(currentTopic + '/typing', JSON.stringify({ clientId: clientId, isTyping: true }));
                clearTimeout(typingTimeout);
                typingTimeout = setTimeout(() => {
                    client.publish(currentTopic + '/typing', JSON.stringify({ clientId: clientId, isTyping: false }));
                }, 1500);
            }
        });

        // إرسال صورة
        imageBtn.addEventListener('click', () => {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvasImg = document.createElement('canvas');
                        const maxDim = 800;
                        let width = img.width;
                        let height = img.height;
                        if (width > height && width > maxDim) {
                            height = height * (maxDim / width);
                            width = maxDim;
                        } else if (height > maxDim) {
                            width = width * (maxDim / height);
                            height = maxDim;
                        }
                        canvasImg.width = width;
                        canvasImg.height = height;
                        const ctxImg = canvasImg.getContext('2d');
                        ctxImg.drawImage(img, 0, 0, width, height);
                        const data = canvasImg.toDataURL('image/jpeg', 0.7);
                        
                        const message = {
                            type: 'image',
                            data: data,
                            clientId: clientId,
                            timestamp: Date.now()
                        };
                        sendMessage(message);
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            };
            input.click();
        });

        // تسجيل الصوت
        micBtn.addEventListener('click', () => {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                alert('متصفحك لا يدعم التسجيل');
                return;
            }
            
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                // إيقاف التسجيل
                mediaRecorder.stop();
                micBtn.style.color = '';
                document.querySelector('.recording-indicator')?.remove();
                return;
            }
            
            navigator.mediaDevices.getUserMedia({ audio: true })
                .then(stream => {
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = (e) => {
                        if (e.data.size > 0) audioChunks.push(e.data);
                    };
                    mediaRecorder.onstop = () => {
                        const blob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.onload = (event) => {
                            const data = event.target.result;
                            const message = {
                                type: 'audio',
                                data: data,
                                clientId: clientId,
                                timestamp: Date.now()
                            };
                            sendMessage(message);
                        };
                        reader.readAsDataURL(blob);
                        // إيقاف المسار
                        stream.getTracks().forEach(track => track.stop());
                    };
                    mediaRecorder.start();
                    micBtn.style.color = '#ff4d7d';
                    const indicator = document.createElement('div');
                    indicator.className = 'recording-indicator';
                    indicator.textContent = 'جارٍ التسجيل... اضغط مرة أخرى للإيقاف';
                    document.body.appendChild(indicator);
                })
                .catch(err => {
                    console.error(err);
                    alert('تعذر الوصول إلى الميكروفون');
                });
        });

        // ========== الدخول ==========
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const password = passwordInput.value.trim();
            if (!password) return;
            errorMsg.textContent = '';
            connectToBroker(password);
        });

        // منع الإرسال في البداية
        sendBtn.disabled = true;
    </script>
</body>
</html>
